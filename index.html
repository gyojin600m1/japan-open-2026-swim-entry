<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ジャパンオープン2026 エントリー確認</title>
<style>
/* layout: sticky header + 4 tabs, single column of cards, phone first */
:root{color-scheme:dark;--bg:#0e1626;--surface:#16213e;--surface2:#0f3460;--accent:#00c4ff;--accent2:#0077cc;--male:#1e6fd0;--female:#c2267a;--text:#e8f0fe;--text2:#9db0cc;--border:#24395c;--card-bg:#13203a;--kago:#ff8c42;--warn:#ff5d5d;--warn-bg:#3a1520;--ok:#3ddc97;--radius:12px;
--font:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;max-width:640px;margin:0 auto;font-size:14px;line-height:1.5;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:150;background:#0a1628;}
button,select,input{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
[hidden]{display:none!important;}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
/* overlay */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;}
#overlay-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:360px;width:100%;max-height:92vh;overflow:auto;}
#overlay-box h2{font-size:16px;color:var(--accent);margin-bottom:16px;text-align:center;}
#overlay-box ol{padding-left:20px;font-size:14px;line-height:2;}
#overlay-box .note{font-size:12px;color:var(--text2);margin-top:12px;line-height:1.7;}
#overlay-box .store-btn{display:block;margin-top:14px;padding:10px;background:linear-gradient(135deg,#007aff,#005ec4);border-radius:10px;color:#fff;text-align:center;text-decoration:none;font-size:14px;font-weight:700;}
#overlay-box .close-btn{width:100%;margin-top:14px;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
/* header */
.header{background:linear-gradient(135deg,#0a1628,#0d1f3c);border-bottom:1px solid var(--border);padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.5);}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.header-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.header-title{font-size:16px;font-weight:700;line-height:1.25;}
.header-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.prov{margin-left:auto;font-size:11px;font-weight:700;color:#ffd166;border:1px solid #ffd166;border-radius:6px;padding:2px 7px;white-space:nowrap;flex-shrink:0;}
.tabs{display:flex;margin-bottom:12px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.tab{flex:1;padding:9px 0;text-align:center;font-size:11.5px;white-space:nowrap;font-weight:700;color:var(--text2);cursor:pointer;background:var(--surface2);border:none;-webkit-tap-highlight-color:transparent;}
.tab.active{background:linear-gradient(135deg,var(--accent2),#005fa3);color:#fff;}
/* filters */
.gender-filter{display:flex;gap:6px;margin-bottom:10px;}
.gchip{flex:1;padding:8px 0;text-align:center;font-size:13px;font-weight:700;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.gchip.active-all{background:var(--accent2);border-color:var(--accent);color:#fff;}
.gchip.active-male{background:var(--male);border-color:var(--male);color:#fff;}
.gchip.active-female{background:var(--female);border-color:var(--female);color:#fff;}
.search-wrap{display:flex;gap:8px;margin-bottom:10px;}
.search-input{flex:1;min-width:0;padding:12px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:16px;outline:none;}
.search-input::placeholder{color:var(--text2);}
.search-input:focus{border-color:var(--accent);}
.search-btn{padding:12px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--radius);color:#fff;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;}
.sel-row{display:flex;gap:8px;margin-bottom:10px;}
.sel{flex:1;min-width:0;padding:10px 12px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;outline:none;appearance:none;-webkit-appearance:none;}
.sel option{background:#1a2234;color:#e8f0fe;}
.chips-scroll{overflow-x:auto;white-space:nowrap;padding-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chips-scroll::-webkit-scrollbar{display:none;}
.chip{display:inline-block;padding:5px 12px;margin-right:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2);cursor:pointer;}
.chip.active{background:var(--accent2);border-color:var(--accent);color:#fff;}
.program-select{width:100%;padding:12px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;outline:none;appearance:none;-webkit-appearance:none;margin-bottom:12px;}
.program-select option{background:#1a2234;color:#e8f0fe;}
.panel{display:none;}
.panel.active{display:block;}
.main{padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.status-bar{font-size:12px;color:var(--text2);padding:6px 4px 10px;text-align:center;}
.status-bar span{color:var(--accent);font-weight:700;}
/* swimmer card */
.swimmer-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.swimmer-card.open{border-color:var(--accent2);}
.swimmer-card.flag{border-color:var(--warn);}
.card-header{width:100%;text-align:left;background:none;border:none;color:inherit;padding:13px 14px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:block;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.swimmer-name{font-size:16px;font-weight:700;flex:1;min-width:0;}
.swimmer-name small{display:block;font-size:11px;font-weight:400;color:var(--text2);letter-spacing:.03em;}
.badge{font-size:11px;background:var(--accent2);color:#fff;border-radius:10px;padding:2px 9px;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.badge.ro{background:#5a4a9c;}
.card-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
.swimmer-team{font-size:13px;color:var(--text2);}
.tag{font-size:11px;color:var(--text2);background:var(--surface2);border-radius:6px;padding:1px 7px;white-space:nowrap;}
.gen-tag{font-size:11px;border-radius:6px;padding:1px 8px;font-weight:700;color:#fff;white-space:nowrap;}
.gen-tag.male{background:var(--male);}
.gen-tag.female{background:var(--female);}
.warn-tag{font-size:11px;border-radius:6px;padding:1px 8px;font-weight:700;color:#fff;background:var(--warn);white-space:nowrap;}
.toggle-hint{margin-top:7px;font-size:11px;color:var(--accent);}
.details{display:none;border-top:1px solid var(--border);}
.swimmer-card.open .details{display:block;}
.ev-item{padding:10px 14px;border-bottom:1px solid rgba(36,57,92,0.7);}
.ev-item:last-child{border-bottom:none;}
.ev-item.red{background:var(--warn-bg);}
.ev-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;}
.ev-name{font-size:14px;font-weight:700;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;text-align:left;text-decoration:underline;text-decoration-color:rgba(0,196,255,.35);text-underline-offset:3px;}
.ev-rank{font-size:12px;color:var(--text2);}
.ev-rank b{color:var(--text);}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
.times div{background:rgba(0,196,255,0.07);border-radius:6px;padding:4px 8px;}
.times label{display:block;font-size:10px;color:var(--text2);}
.times span{font-size:13px;font-weight:600;}
.q{font-size:10px;font-weight:700;color:var(--ok);margin-left:3px;}
.q.lq{color:#ffd166;}
.ev-sched{font-size:11px;color:var(--text2);margin-top:5px;}
.detail-foot{padding:10px 14px;font-size:12px;color:var(--text2);border-top:1px solid var(--border);line-height:1.7;}
.linkbtn{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;}
/* team card */
.team-card{background:linear-gradient(135deg,#12284b,#13203a);border:1px solid var(--accent2);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;}
.team-card h3{font-size:16px;}
.team-card p{font-size:12px;color:var(--text2);margin-top:3px;overflow-wrap:anywhere;}
.team-nums{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.team-hit{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card-bg);border:1px dashed var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;color:var(--text);cursor:pointer;font-size:14px;}
.team-hit small{color:var(--text2);font-size:12px;}
/* event list */
.ev-info{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;font-size:12px;color:var(--text2);line-height:1.8;}
.ev-info b{color:var(--text);}
.gender-block-title{font-size:14px;font-weight:700;padding:10px 4px 8px;border-bottom:2px solid;margin:14px 0 10px;}
.gender-block-title.male{color:#5aa2ff;border-color:var(--male);}
.gender-block-title.female{color:#ff6fb5;border-color:var(--female);}
.entry-row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;color:var(--text);background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;cursor:pointer;}
.entry-row.red{border-color:var(--warn);background:var(--warn-bg);}
.entry-row.cut{margin-bottom:2px;}
.rank{font-size:15px;font-weight:700;color:var(--text2);text-align:center;}
.rank.top{color:#ffd166;}
.entry-name{font-size:15px;font-weight:700;}
.entry-sub{font-size:12px;color:var(--text2);margin-top:1px;}
.entry-time{text-align:right;}
.entry-time .t{font-size:15px;font-weight:700;color:var(--accent);}
.entry-time .s{font-size:10px;color:var(--text2);}
.cutline{font-size:11px;color:#ffd166;text-align:center;margin:6px 0 10px;display:flex;align-items:center;gap:8px;}
.cutline::before,.cutline::after{content:"";flex:1;border-top:1px dashed #ffd166;opacity:.6;}
/* relay */
.relay-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;}
.relay-team{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.relay-members{font-size:13px;color:var(--text2);line-height:1.9;}
.relay-members b{font-weight:600;}
.m{color:#8fc0ff;} .f{color:#ff9acb;}
.relay-members button{background:none;border:none;font:inherit;cursor:pointer;padding:0 2px;text-decoration:underline;text-decoration-color:rgba(255,255,255,.25);text-underline-offset:3px;}
/* info */
.sec-title{font-size:14px;font-weight:700;color:var(--accent);padding:14px 4px 8px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px;}
.stat-item{text-align:center;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:10px 2px;}
.stat-num{font-size:19px;font-weight:700;color:var(--accent);}
.stat-label{font-size:10px;color:var(--text2);margin-top:2px;}
.notice{background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--radius);padding:12px 14px;font-size:12px;line-height:1.8;margin-bottom:10px;}
.notice b{color:#ff9b9b;}
.day{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.day summary{padding:12px 14px;font-weight:700;cursor:pointer;font-size:14px;}
.sess{font-size:11px;color:#ffd166;padding:6px 14px 2px;font-weight:700;letter-spacing:.05em;}
.race{display:grid;grid-template-columns:30px 1fr auto;gap:8px;width:100%;padding:7px 14px;font-size:13px;border:none;border-top:1px solid rgba(36,57,92,0.6);background:none;color:var(--text);text-align:left;cursor:pointer;}
.race .rn{color:var(--text2);text-align:right;}
.race .rk{font-size:11px;color:var(--text2);white-space:nowrap;}
.std-wrap{overflow-x:auto;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;}
table.std{border-collapse:collapse;width:100%;font-size:12px;min-width:340px;}
table.std th,table.std td{padding:6px 8px;text-align:right;border-bottom:1px solid rgba(36,57,92,0.6);white-space:nowrap;}
table.std th{color:var(--text2);font-weight:600;font-size:11px;}
table.std td:first-child,table.std th:first-child{text-align:left;}
.src{font-size:11px;color:var(--text2);line-height:1.9;padding:4px;}
.src a{color:var(--accent);overflow-wrap:anywhere;}
.kg-note{font-size:12px;color:var(--text2);background:rgba(255,140,66,.08);border-left:3px solid var(--kago);border-radius:0 8px 8px 0;padding:6px 10px;margin:0 0 6px;line-height:1.6;}
.kg-tag{font-size:11px;border-radius:6px;padding:1px 8px;font-weight:700;color:#1a1005;background:var(--kago);white-space:nowrap;}
.kg-lead{font-size:12px;color:var(--text2);line-height:1.7;padding:0 4px 8px;}
.sec-title.kg{color:var(--kago);}
.no-result{text-align:center;padding:50px 20px;color:var(--text2);}
.no-result .emoji{font-size:40px;margin-bottom:12px;}
.initial-state{text-align:center;padding:24px 8px;color:var(--text2);}
.initial-state h3{font-size:16px;color:var(--text);margin-bottom:8px;}
.initial-state p{font-size:13px;line-height:1.7;}
.more-btn{width:100%;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="header-icon">🏊</div>
    <div>
      <div class="header-title">ジャパンオープン2026（50m）</div>
      <div class="header-sub">エントリー確認｜12/4(金)〜6(日) 東京アクアティクスセンター</div>
    </div>
    <div class="prov" title="2026/11/09 00:40 時点の暫定データ">暫定 11/9</div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab active" type="button" data-tab="1">🔍 選手</button>
    <button class="tab" type="button" data-tab="2">📋 種目</button>
    <button class="tab" type="button" data-tab="3">🔄 リレー</button>
    <button class="tab" type="button" data-tab="4">🌋 鹿児島</button>
    <button class="tab" type="button" data-tab="5">📅 情報</button>
  </div>
</div>

<div class="main">
  <div class="panel active" id="panel1">
    <div class="gender-filter" id="gf1">
      <button type="button" class="gchip active-all" data-g="all">全員</button>
      <button type="button" class="gchip" data-g="male">🔵 男子</button>
      <button type="button" class="gchip" data-g="female">🔴 女子</button>
    </div>
    <div class="search-wrap">
      <input type="search" class="search-input" id="searchInput" placeholder="氏名・ローマ字・チーム・選手番号" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="search-btn" id="searchBtn" type="button">検索</button>
    </div>
    <div class="sel-row">
      <select class="sel" id="gradeSel" aria-label="学年"><option value="">学年：すべて</option></select>
      <select class="sel" id="prefSel" aria-label="加盟団体"><option value="">加盟団体：すべて</option></select>
    </div>
    <div class="chips-scroll" id="chipsArea"></div>
    <div id="statusBar1" class="status-bar" hidden></div>
    <div id="result1"></div>
  </div>

  <div class="panel" id="panel2">
    <div class="gender-filter" id="gf2">
      <button type="button" class="gchip active-all" data-g="all">全員（男女分割）</button>
      <button type="button" class="gchip" data-g="male">🔵 男子</button>
      <button type="button" class="gchip" data-g="female">🔴 女子</button>
    </div>
    <select class="program-select" id="programSelect" aria-label="種目"></select>
    <div id="statusBar2" class="status-bar" hidden></div>
    <div id="result2"></div>
  </div>

  <div class="panel" id="panel3">
    <div class="gender-filter" id="gf3">
      <button type="button" class="gchip active-all" data-g="all">全員</button>
      <button type="button" class="gchip" data-g="male">🔵 男子</button>
      <button type="button" class="gchip" data-g="female">🔴 女子</button>
    </div>
    <div id="statusBar3" class="status-bar" hidden></div>
    <div id="result3"></div>
  </div>

  <div class="panel" id="panel4">
    <div class="gender-filter" id="gf4">
      <button type="button" class="gchip active-all" data-g="all">全員</button>
      <button type="button" class="gchip" data-g="male">🔵 男子</button>
      <button type="button" class="gchip" data-g="female">🔴 女子</button>
    </div>
    <div id="statusBar4" class="status-bar" hidden></div>
    <div id="result4"></div>
  </div>
  <div class="panel" id="panel5"><div id="result5"></div></div>

    h+=`<div class="sec-title kg">${sc[1]}　${list.length}名</div><div class="kg-lead">${sc[2]}</div>`;
    list.forEach(k=>{h+=`<div class="kg-note">${esc(k.note)}</div>`+swimmerCard(k.s,false);});});
  const rows=[];vis.forEach(k=>k.s.ev.forEach(e=>rows.push(e)));
  rows.sort((a,b)=>a.ev.rn.h-b.ev.rn.h||a.rank-b.rank);
  h+=`<div class="sec-title kg">📣 応援スケジュール（予選・ﾀｲﾑ決勝のレース順）</div>`;
  let day=0;rows.forEach(e=>{if(e.ev.day.d!==day){day=e.ev.day.d;h+=`<div class="sess" style="padding-left:4px">${e.ev.day.label}</div>`;}
    h+=`<button type="button" class="entry-row" data-no="${e.sw.no}"><div class="rank num">${e.ev.rn.h}</div><div style="min-width:0"><div class="entry-name">${esc(e.sw.name)}${e.sw.kg===1?' <span class="kg-tag">出身</span>':''}</div><div class="entry-sub">${e.ev.g} ${e.ev.label}・${teamLine(e.sw)}</div></div><div class="entry-time"><div class="t num">${esc(e.entry)}</div><div class="s">${e.rank}位 / ${e.ev.n}名</div></div></button>`;});
  h+=`<div class="ev-info">調べ方：出身は「高校」で判定しています。全エントリー797名を、(1) インターハイ2008〜2026年の公式記録にある鹿児島県の学校所属選手、(2) 鹿児島県水泳連盟の2022〜2026年の大会結果・県記録、(3) 国体の鹿児島県選手団成績と照合しました（2020年のインターハイは中止）。県内の大学・実業団所属の選手は出身高校を個別に確認しています。<br>インターハイ不出場で2021年以前に高校を卒業した鹿児島の高校出身者は、公開記録からは拾えません。ほかにお心当たりがあれば追加します。</div>`;
  $('statusBar4').hidden=false;$('statusBar4').innerHTML=`鹿児島出身 <span>${vis.filter(k=>k.cat===1).length}</span>名／鹿児島関係 計<span>${total}</span>名`;
  $('result4').innerHTML=h;
}
/* ---------- tab 4 ---------- */
function renderInfo(){
  const red=[];SW.forEach(s=>s.ev.forEach(e=>{if(e.red)red.push(e);}));
  let h=`<div class="notice"><b>📌 エントリー確認・訂正期間：11月9日（月）正午〜11日（水）</b><br>訂正がある場合は、11月11日（水）までに日本水泳連盟へ直接FAX（03-6812-9062）で送信してください。このアプリは 2026/11/09 00:40 作成の<b>暫定</b>データです。</div>`;
  h+=`<div class="sec-title">⚠️ 標準記録の突破が未確認（${red.length}件）</div>`+red.map(e=>`<button type="button" class="entry-row red" data-no="${e.sw.no}"><div class="rank">⚠️</div><div style="min-width:0"><div class="entry-name">${esc(e.sw.name)}</div><div class="entry-sub">${teamLine(e.sw)}・${e.ev.g} ${e.ev.label}</div></div><div class="entry-time"><div class="t num">${esc(e.entry)}</div></div></button>`).join('');
  h+=`<div class="sec-title">📅 競技順序</div>`;
  SCHED.forEach((day,di)=>{
    const race=x=>x.ev?`<button type="button" class="race" data-ev="${x.ev.i}"><span class="rn num">${x.n}</span><span>${x.ev.g} ${x.ev.label}</span><span class="rk">${x.kind}${x.kind==='Ｂ決勝'&&!hasB(x.ev)?'（実施なし）':''}・${x.ev.n}名</span></button>`
      :`<button type="button" class="race" data-relay="1"><span class="rn num">${x.n}</span><span>混合 4×100m ${x.relay}</span><span class="rk">${x.kind}</span></button>`;
    const pre=day.heats.filter(x=>x.kind==='予選'),tf=day.heats.filter(x=>x.kind!=='予選');
    h+=`<details class="day"${di===0?' open':''}><summary>${day.D.label}</summary><div class="sess">予選</div>${pre.map(race).join('')}${day.rh?race(day.rh):''}${tf.map(race).join('')}
    <div class="sess">Ｂ決勝・決勝</div>${day.bf.map(race).join('')}${tf.length?tf.map(x=>race({...x,kind:'ﾀｲﾑ決勝（最終組）'})).join(''):''}${day.fin.map(race).join('')}${day.rf?race(day.rf):''}</details>`;});
  h+=`<div class="ev-info">12月3日（木）は公式練習日（11:00〜18:00）・選手受付 11:00〜・監督者会議 15:00（観客席）。Ｂ決勝は予選申込者25名以上の種目のみ実施。800m・1500m自由形はタイムレース決勝。</div>`;
  h+=`<div class="sec-title">🎯 標準記録</div><div class="std-wrap"><table class="std"><thead><tr><th>種目</th><th>男子 短</th><th>男子 長</th><th>女子 短</th><th>女子 長</th></tr></thead><tbody>${Object.keys(STD).map(k=>{const [d,s]=k.split('|');return `<tr><td>${d}m ${s}</td>${STD[k].map(v=>`<td class="num">${v||'—'}</td>`).join('')}</tr>`;}).join('')}</tbody></table></div>
  <div class="ev-info">2025年11月28日以降の公式・公認競技会での記録が対象。男子800m自由形は400m・1500mいずれか、女子1500m自由形は800mの標準記録突破者が出場可。Q は標準記録突破の印です。小文字の q は公式PDFの表記をそのまま載せており、男子800m・女子1500m自由形（他種目の標準記録で出場）や海外選手のタイムなどに付いていますが、公式の説明は見つかっていません。</div>`;
  h+=`<div class="sec-title">📄 データの出典</div><div class="src">日本水泳連盟 大会ページ（11月9日時点公開分）<br><a href="https://aquatics.or.jp/tournament/57943/" target="_blank" rel="noopener">https://aquatics.or.jp/tournament/57943/</a><br>種目別エントリー一覧／参加申込集計一覧／登録団体別エントリー一覧／EntryListByTeam／大会要項<br>種目別エントリーランキング／インターハイ公式記録（出身高校の確認）<br>集計一覧の総計（選手${DATA.tot[0]}名・個人${DATA.tot[3]}種目・リレー${DATA.tot[6]}種目・付添票）と全団体で照合済み。順位は公式ランキングPDFの掲載順と全件一致。正式な内容は必ず公式PDFでご確認ください。</div>`;
  $('result5').innerHTML=h;
}
/* ---------- wiring ---------- */
function switchTab(n){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',+t.dataset.tab===n));document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('active',i===n-1));
  if(n===2&&!$('result2').innerHTML)searchByProgram();if(n===3)showRelay();if(n===4)showKago();if(n===5&&!$('result5').innerHTML)renderInfo();}
function setGenderUI(tab,val){genderState[tab]=val;$('gf'+tab).querySelectorAll('.gchip').forEach(c=>{c.className='gchip'+(c.dataset.g===val?' active-'+val:'');});}
[1,2,3,4].forEach(tab=>$('gf'+tab).addEventListener('click',e=>{const c=e.target.closest('.gchip');if(!c)return;setGenderUI(tab,c.dataset.g);if(tab===1)doSearch();else if(tab===2)searchByProgram();else if(tab===3)showRelay();else showKago();}));
document.querySelector('.tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)switchTab(+t.dataset.tab);});
document.querySelector('.main').addEventListener('click',e=>{
  const b=e.target.closest('[data-ev],[data-team],[data-no],[data-relay],.card-header,#more1,#clearTeam');if(!b)return;
  if(b.id==='more1'){limit1+=100;doSearch();return;}
  if(b.id==='clearTeam'){teamFilter=null;limit1=60;$('searchInput').value='';doSearch();return;}
  if(b.dataset.ev!==undefined){showEvent(+b.dataset.ev);return;}
  if(b.dataset.team){showTeam(b.dataset.team);return;}
  if(b.dataset.no){showSwimmer(+b.dataset.no);return;}
  if(b.dataset.relay){switchTab(3);window.scrollTo(0,0);return;}
  if(b.classList.contains('card-header')){const c=b.closest('.swimmer-card');const o=c.classList.toggle('open');b.setAttribute('aria-expanded',o);b.querySelector('.toggle-hint').textContent=o?'▲ 閉じる':'▼ タップで出場種目を表示';}
});
function userSearch(){teamFilter=null;limit1=60;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));doSearch();}
$('searchBtn').addEventListener('click',userSearch);
let deb;$('searchInput').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(userSearch,180);});
$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){userSearch();e.target.blur();}});
$('gradeSel').addEventListener('change',()=>{limit1=60;doSearch();});
$('prefSel').addEventListener('change',()=>{limit1=60;doSearch();});
$('programSelect').addEventListener('change',()=>{setGenderUI(2,'all');searchByProgram();});
/* selects & chips */
[['中','中学生'],['高','高校生'],['大','大学生'],['一般','一般']].forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent='学年：'+o[1];$('gradeSel').appendChild(op);});
[...new Set(SW.map(s=>s.gr))].filter(g=>g!=='一般').sort((a,b)=>'中高大'.indexOf(a[0])-'中高大'.indexOf(b[0])||a.localeCompare(b)).forEach(g=>{const op=document.createElement('option');op.value=g;op.textContent='学年：'+g;$('gradeSel').appendChild(op);});
[...new Set(DATA.tm.map(t=>t[4]))].forEach(p=>{const op=document.createElement('option');op.value=p;op.textContent='加盟団体：'+p;$('prefSel').appendChild(op);});
Object.values(TM).sort((a,b)=>b.sw.length-a.sw.length).slice(0,14).forEach(t=>{const c=document.createElement('button');c.type='button';c.className='chip';c.textContent=t.disp;c.onclick=()=>{showTeam(t.code);document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===c));};$('chipsArea').appendChild(c);});
STROKES.forEach(s=>{const og=document.createElement('optgroup');og.label=s;[...new Set(EV.filter(e=>e.s===s).map(e=>e.d))].sort((a,b)=>a-b).forEach(d=>{const op=document.createElement('option');op.value=d+'|'+s;op.textContent=d+'m '+s;og.appendChild(op);});$('programSelect').appendChild(og);});
initial1();
</script>
</body>
